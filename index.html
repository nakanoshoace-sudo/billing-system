<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>billing-system</title>
<style>
  :root{
    /* light theme — white base, gray text, single teal accent */
    --bg:#F7F8FA; --bg-2:#FFFFFF; --panel:#FFFFFF; --panel-2:#FFFFFF; --raised:#EEF1F4;
    --line:#E4E7EC; --line-soft:#EDF0F3; --ink:#1F2937; --ink-2:#4B5563; --ink-3:#8792A2;
    --ai:#0F9488; --ai-dim:#8FD4CC; --ai-glow:rgba(15,148,136,.08);
    --ok:#177A46; --ok-dim:rgba(23,122,70,.09);
    --delta:#A16207; --delta-dim:rgba(161,98,7,.10);
    --ret:#B42346; --ret-dim:rgba(180,35,70,.08);
    --violet:#6B7280; --radius:14px;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);
    color:var(--ink);font-family:var(--jp);-webkit-font-smoothing:antialiased;letter-spacing:.01em;min-height:100vh;line-height:1.65;font-size:14px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:6px}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  a{color:var(--ai)}

  /* topbar */
  .topbar{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .mark{width:34px;height:34px;border-radius:9px;flex:none;background:var(--ai);overflow:hidden;
    display:grid;place-items:center;color:#FFFFFF;font-weight:800;font-family:var(--mono);font-size:15px;
    box-shadow:0 1px 2px rgba(15,23,42,.10)}
  .mark img{width:100%;height:100%;object-fit:cover;display:block}
  .brand h1{font-size:14.5px;margin:0;font-weight:700} .brand .sub{font-size:11px;color:var(--ink-3);margin-top:1px}
  .tb-spacer{flex:1}
  .savechip{font-size:11px;color:var(--ink-2);border:1px solid var(--line);padding:6px 11px;border-radius:999px;background:var(--panel);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .savechip .d{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .savechip.mem .d{background:var(--delta)}
  @media(max-width:640px){.savechip .lbl{display:none}}

  /* tabs */
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:12px 22px 0;border-bottom:1px solid var(--line);background:#FFFFFF;position:sticky;top:59px;z-index:30}
  .tab{flex:none;padding:10px 15px;border:none;background:none;color:var(--ink-3);font-family:var(--jp);font-size:13px;cursor:pointer;
    border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .tab .c{font-family:var(--mono);font-size:11px;background:var(--raised);color:var(--ink-2);border-radius:999px;padding:1px 7px}
  .tab:hover{color:var(--ink-2)}
  .tab.on{color:var(--ink);border-bottom-color:var(--ai)} .tab.on .c{background:var(--ai);color:#FFFFFF;font-weight:700}

  .wrap{max-width:1120px;margin:0 auto;padding:22px 22px 60px}
  @media(max-width:620px){.wrap{padding:16px 13px 44px}}

  /* generic */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
  .ch .lt{display:flex;flex-direction:column;gap:3px;min-width:0}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ai);text-transform:uppercase}
  .ch h2{margin:0;font-size:16px;font-weight:700}
  .ch .meta{font-size:11.5px;color:var(--ink-3)}
  .row-cta{display:flex;gap:8px;flex-wrap:wrap}
  .pad{padding:18px}
  .muted{color:var(--ink-3)}
  .empty{padding:40px 18px;text-align:center;color:var(--ink-3);font-size:13px}
  .empty b{color:var(--ink-2);display:block;margin-bottom:6px;font-size:14px}

  .btn{font-family:var(--jp);font-size:12.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--ai-dim);color:var(--ink)}
  .btn svg{width:14px;height:14px}
  .btn.pri{color:#FFFFFF;font-weight:700;border:none;background:var(--ai);box-shadow:0 1px 2px rgba(15,23,42,.10)}
  .btn.pri:hover{background:#0B7E74}
  .btn.pri:hover{transform:translateY(-1px)}
  .btn.pri:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.sm{padding:6px 10px;font-size:11.5px}
  .btn.danger:hover{border-color:var(--ret);color:var(--ret)}
  .btn.icon{padding:7px}

  /* tables */
  table.dtable{width:100%;border-collapse:collapse;font-size:12.5px}
  .dtable th{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
  .dtable td{padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  .dtable tr:last-child td{border-bottom:none}
  .dtable td.n,.dtable th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  .dtable tbody tr:hover{background:rgba(15,148,136,.04)}
  .scrollx{overflow-x:auto}
  .media-cell{display:flex;align-items:center;gap:9px}
  .mlogo{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700;color:#0B1220}
  .mn{font-size:11px;color:var(--ink-2);white-space:nowrap}
  .cl{color:var(--ink)} .cl .p{display:block;font-size:10px;color:var(--ink-3);font-family:var(--mono)}
  .deptpill{font-family:var(--mono);font-size:10px;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;white-space:nowrap}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-family:var(--mono);padding:4px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
  .badge .bd{width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.pending{color:var(--ink-3);border-color:var(--line);background:var(--panel)}
  .badge.req{color:var(--violet);background:rgba(107,114,128,.08);border-color:rgba(107,114,128,.30)}
  .badge.ok{color:var(--ok);background:var(--ok-dim);border-color:rgba(23,122,70,.30)}
  .badge.delta{color:var(--delta);background:var(--delta-dim);border-color:rgba(161,98,7,.30)}
  .badge.ret{color:var(--ret);background:var(--ret-dim);border-color:rgba(180,35,70,.28)}
  .badge.scan{color:var(--ai);border-color:var(--ai-dim);background:var(--ai-glow)}
  .badge.scan .bd{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .conf{display:inline-flex;align-items:center;gap:8px}
  .conf .pct{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
  .conf .track{width:52px;height:4px;border-radius:3px;background:var(--raised);overflow:hidden}
  .conf .fill{height:100%;border-radius:3px;background:var(--ai);transition:width .6s cubic-bezier(.2,.8,.2,1)}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .kpi.accent{border-color:var(--ai-dim);background:var(--ai-glow)}
  .kpi .k{font-size:11px;color:var(--ink-3);margin-bottom:8px}
  .kpi .big{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px}
  .kpi .big .v{font-size:26px;color:var(--ink)} .kpi.accent .big .v{color:var(--ai)}
  .kpi .big .u{font-size:12px;color:var(--ink-3)}
  .kpi .sub{margin-top:7px;font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}

  .funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:18px}
  @media(max-width:700px){.funnel{grid-template-columns:1fr 1fr}}
  .fstep{border:1px solid var(--line-soft);border-radius:11px;padding:13px;background:var(--bg-2);position:relative}
  .fstep .fl{font-size:11px;color:var(--ink-3);margin-bottom:6px}
  .fstep .fv{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--ink)}
  .fstep .fu{font-size:10px;color:var(--ink-3);margin-left:3px}

  /* forms */
  .form{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}
  @media(max-width:560px){.form{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  .field label{font-size:11px;color:var(--ink-3)}
  .field input,.field select,.field textarea{font-family:var(--jp);font-size:13px;color:var(--ink);background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
  .field input.num,.field input[type=number]{font-family:var(--mono)}
  .field textarea{min-height:70px;resize:vertical;font-family:var(--mono);font-size:12px}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ai-dim);outline:none}
  .hint{font-size:10.5px;color:var(--ink-3)}

  /* email drafts */
  .draft{border:1px solid var(--line);border-radius:12px;background:var(--bg-2);overflow:hidden;margin-bottom:14px}
  .draft .dh{padding:12px 15px;border-bottom:1px solid var(--line-soft);background:var(--panel);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .draft .to{font-size:12.5px;color:var(--ink);font-weight:600}
  .draft .to .em{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-weight:400;margin-left:6px}
  .draft .dh .row-cta{margin-left:auto}
  .to-edit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
  .to-label{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
  .to-input{font-family:var(--jp);font-size:12.5px;color:var(--ink);background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:230px;max-width:60vw}
  .to-input:focus{border-color:var(--ai);outline:none}
  .to-dept{font-size:11px;color:var(--ink-3);flex:none}
  .draft .body{padding:13px 15px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);line-height:1.7;white-space:pre-wrap}

  /* approval */
  .apbtns{display:inline-flex;gap:6px}
  .apbtn{font-family:var(--jp);font-size:11px;border-radius:7px;padding:6px 11px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink-2)}
  .apbtn.approve:hover{border-color:var(--ok);color:var(--ok)} .apbtn.return:hover{border-color:var(--ret);color:var(--ret)}
  .airec{font-family:var(--mono);font-size:10px;color:var(--ai)} .airec.rt{color:var(--ret)}
  .flagtip{font-size:10.5px;color:var(--delta);margin-top:3px}

  /* metrics */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:18px;border-top:1px solid var(--line-soft)}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:40px 16px;overflow-y:auto}
  .overlay.show{display:flex}
  .mbox{width:100%;max-width:560px;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(15,23,42,.16)}
  .mbox .mh{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line-soft)}
  .mbox .mh h3{margin:0;font-size:15px}
  .mbox .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line-soft)}

  /* toast */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--ai-dim);color:var(--ink);
    padding:11px 18px;border-radius:10px;font-size:12.5px;z-index:70;opacity:0;transition:.25s;box-shadow:0 6px 20px rgba(15,23,42,.12);display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .d{width:7px;height:7px;border-radius:50%;background:var(--ok)}

  /* governance */
  .gov{border:1px solid var(--line);border-radius:var(--radius);background:#FAFBFC;padding:18px 20px;margin-bottom:20px}
  .gov .gh{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .gov .gh .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--violet);border:1px solid rgba(107,114,128,.35);padding:3px 8px;border-radius:5px}
  .gov .gh .t{font-size:12.5px;color:var(--ink-2)} .gov .gh .t b{color:var(--ink);font-weight:700}
  .gflow{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
  @media(max-width:820px){.gflow{grid-template-columns:1fr 1fr}}
  @media(max-width:460px){.gflow{grid-template-columns:1fr}}
  .gstep{padding:0 16px;position:relative}
  .gstep:not(:last-child)::after{content:"→";position:absolute;right:-9px;top:2px;color:var(--ink-3);font-family:var(--mono)}
  @media(max-width:820px){.gstep:nth-child(2)::after,.gstep:last-child::after{content:""}}
  .gstep .gn{font-family:var(--mono);font-size:10px;color:var(--ai)} .gstep .gt{font-size:12px;color:var(--ink);font-weight:600;margin:5px 0 4px}
  .gstep .gd{font-size:10.5px;color:var(--ink-3);line-height:1.6}
  .footnote{font-size:10.5px;color:var(--ink-3);line-height:1.7;margin-top:8px}
  .banner{border:1px solid rgba(161,98,7,.30);background:var(--delta-dim);border-radius:11px;padding:11px 14px;font-size:11.5px;color:var(--ink-2);margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
  .banner .warnpill{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--delta);border:1px solid rgba(161,98,7,.35);padding:2px 7px;border-radius:5px;flex:none}

  /* dashboard manual */
  .msteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:18px}
  .mstep{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg-2)}
  .mstep .mn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--ai);color:#FFF;font-family:var(--mono);font-size:12px;font-weight:700;margin-bottom:10px}
  .mstep .mt{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .mstep .md{font-size:12px;color:var(--ink-2);line-height:1.8}
  .mstep .md b{color:var(--ink)}
  .mstep .mlink{display:inline-block;margin-top:9px;font-size:11.5px;color:var(--ai);cursor:pointer;font-weight:600;text-decoration:none}
  .mstep .mlink:hover{text-decoration:underline}
  .manual-notes{padding:0 18px 18px}
  .manual-notes details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg-2)}
  .manual-notes summary{cursor:pointer;padding:11px 14px;font-size:12.5px;font-weight:600;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px}
  .manual-notes summary::-webkit-details-marker{display:none}
  .manual-notes summary::before{content:"›";color:var(--ink-3);transition:transform .15s}
  .manual-notes details[open] summary::before{transform:rotate(90deg)}
  .manual-notes .nd{padding:0 14px 13px 30px;font-size:12px;color:var(--ink-2);line-height:1.9}
  .manual-notes .nd b{color:var(--ink)}

  /* PDF import */
  .mbox.wide{max-width:880px}
  .dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:110px;border:1.5px dashed #CBD3DC;border-radius:12px;padding:26px 20px;text-align:center;color:var(--ink-3);font-size:12.5px;background:#FAFBFC;cursor:pointer;transition:.15s;line-height:1.7}
  .dropzone:hover,.dropzone.drag{border-color:var(--ai);color:var(--ink-2);background:var(--ai-glow)}
  .dropzone input{display:none}
  .dropzone .bigt{font-size:14px;font-weight:600;color:var(--ink);margin:0}
  .pdfstatus{font-size:11.5px;color:var(--ink-3);margin:12px 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pdfstatus.err{color:var(--delta)}
  .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--ai);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .confpill{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:5px;border:1px solid transparent;white-space:nowrap}
  .confpill.hi{color:var(--ok);background:var(--ok-dim);border-color:rgba(23,122,70,.30)}
  .confpill.mid{color:var(--delta);background:var(--delta-dim);border-color:rgba(161,98,7,.30)}
  .confpill.lo{color:var(--ret);background:var(--ret-dim);border-color:rgba(180,35,70,.28)}
  .rvinput{background:var(--bg-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:6px 8px;font-family:var(--jp);font-size:12px}
  .rvinput:focus{border-color:var(--ai-dim);outline:none}
  .rvinput.num{font-family:var(--mono);text-align:right}
</style>

  <div class="brand">
    <div class="mark" id="brandMark">A</div>

<div class="tabs" id="tabs"></div>
<div class="wrap" id="view"></div>

<div class="overlay" id="overlay"></div>

<script>
/* ============================================================
   AIX 請求書オートメーション — 単一ファイルの実働アプリ
   ・自動保存（localStorage、不可環境はメモリ動作）
   ・請求書CRUD / CSV取込・書出 / JSONバックアップ
   ・確認依頼メール（mailto・自動送信なし）/ 承認・差戻し
   ・AI照合（許容差ベース）/ 削減効果の実計算
   ============================================================ */

const MEDIA = {
  "Google広告":{bg:"#8AB4F8",ini:"G"}, "Meta広告":{bg:"#5B8DEF",ini:"M"}, "Yahoo!広告":{bg:"#F45B5B",ini:"Y!"},
  "LINE広告":{bg:"#4FD37A",ini:"L"}, "TikTok広告":{bg:"#9C8CF7",ini:"Tk"}, "X広告":{bg:"#C9D2E0",ini:"X"},
  "Microsoft広告":{bg:"#5CC8C2",ini:"Ms"}, "その他":{bg:"#7C8BA5",ini:"·"}
};
const KEY="aix_ap_v2";
const DEFAULT_TPL_SUBJECT="【要確認】{期間} 媒体費請求 {件数}件";
const DEFAULT_TPL_BODY=`{部署} ご担当者さま

{期間}分の媒体費請求について、配信実績とご確認のうえ、
各請求の「承認」または「差戻し」を、社内ツール『billing-system』の
［部署確認］画面よりご対応ください。

対象請求（{件数}件）：
{明細}

差異・不明点がある場合は差戻しを選択し、媒体照会に回してください。
※ 本メールは{差出人}が自動生成しています。`;
let persistent=true;

/* ---------- storage ---------- */
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); persistent=true; }catch(e){ persistent=false; } updateSaveChip(); }
function loadRaw(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ persistent=false; return null; } }

/* ---------- defaults / sample ---------- */
function defaultState(){
  return {
    v:2,
    company:{ name:"株式会社サンプル", accountingEmail:"keiri@example.co.jp", icon:null },
    params:{ minutes:4, aiRate:75, hourly:2500, volume:340, tolerance:0 },
    depts:[

/* ---------- CSV (pure) ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  text=text.replace(/\r\n?/g,"\n");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===','){ row.push(cur); cur=""; } else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; } else cur+=ch; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.length && r.some(c=>c.trim()!==""));
}
function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toCSV(headers,rows){ return [headers.map(csvCell).join(","), ...rows.map(r=>r.map(csvCell).join(","))].join("\n"); }

function importModal(){
  openModal("CSV取込",`
    <div class="pad" style="padding-bottom:0">
      <div class="field"><label>CSVを貼り付け</label><textarea id="csvText" placeholder="媒体,クライアント,期間,請求額,実費,担当課,担当者&#10;Google広告,サンライズ広告,2026-06,1240000,1240000,運用1課,田中"></textarea></div>
      <p class="hint" style="margin:10px 0">またはファイルを選択：<input type="file" id="csvFile" accept=".csv,text/csv"></p>
    </div>`,
    "取込む", ()=>{
      const doImport=(text)=>{
        const rows=parseCSV(text); if(!rows.length){ toast("データがありません"); return; }
        let head=rows[0].map(s=>s.trim()); let start=1;
        const map={"媒体":"media","クライアント":"client","期間":"period","請求額":"inv","実費":"act","担当課":"dept","担当者":"owner",
                   "media":"media","client":"client","period":"period","inv":"inv","act":"act","dept":"dept","owner":"owner"};
        let idx={};
        const looksHeader=head.some(h=>map[h]);
        if(looksHeader){ head.forEach((h,k)=>{ if(map[h]) idx[map[h]]=k; }); }
        else { idx={media:0,client:1,period:2,inv:3,act:4,dept:5,owner:6}; start=0; }
        let n=0;
        for(let r=start;r<rows.length;r++){ const c=rows[r];
          const get=f=>idx[f]!=null?(c[idx[f]]||"").trim():"";
          const client=get("client"); if(!client) continue;
          const actv=get("act");
          S.invoices.push({ id:S.seq++, media:get("media")||"その他", client, period:get("period")||"2026-06",
            inv:+get("inv").replace(/[^\d.-]/g,"")||0, act:actv===""?null:(+actv.replace(/[^\d.-]/g,"")||0),
            dept:get("dept")||(S.depts[0]?.name||""), owner:get("owner"), flag:null, pdf:null,
            requested:false, approval:"pending", note:"", decidedAt:null, sent:false, reconciled:"none", diff:null });
          n++;
        }
        save(); toast(`${n}件を取込みました`); render();
      };
      const file=$("#csvFile").files[0];
      if(file){ const fr=new FileReader(); fr.onload=()=>{ doImport(fr.result); closeModal(); }; fr.readAsText(file,"utf-8"); return false; }
      const text=$("#csvText").value.trim(); if(!text){ toast("CSVを入力してください"); return false; }
      doImport(text); return true;
    });
}

function viewReq(v){
  const targets=S.invoices.filter(i=>i.approval==="pending");
  const groups=S.depts.map(d=>({dept:d, items:targets.filter(i=>i.dept===d.name)})).filter(g=>g.items.length);
  const real=mailConfigured();
  const modeLabel=(S.mail&&S.mail.mode)==="gas"?"Gmail(GAS)で実送信":(S.mail&&S.mail.mode)==="api"?"社内APIで実送信":"メール下書き(mailto)";
  v.innerHTML=`

    <span class="meta">担当課ごとに自動生成。<b>送信前に宛先を確認・編集</b>できます。送信方法：<b>${modeLabel}</b>${real?"":"（実送信は 設定＞メール送信 で有効化できます）"}</span></div>

    ${groups.length? `<div class="pad">${groups.map((g,gi)=>{
      const body=mailBody(g.dept.name,g.items);
      const subj=mailSubj(g);
      const allSent=g.items.every(i=>i.requested);
      return `<div class="draft">
        <div class="dh">
          <div class="to-edit"><span class="to-label">To</span>
            <input type="email" class="to-input" id="to${gi}" value="${esc(g.dept.email)}" placeholder="宛先メールアドレス" aria-label="${esc(g.dept.name)}の宛先">
            <span class="to-dept">${esc(g.dept.name)}・${g.items.length}件</span>
            ${allSent?' <span class="confpill hi">送信済</span>':''}
          </div>
          <div class="row-cta">
            ${real
              ? `<button class="btn sm pri" data-send="${gi}">${allSent?"再送信":"この宛先に送信"}</button>`

  </div>`;
  if(!groups.length) return;
  const emailOK=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((s||"").trim());
  const getTo=gi=>{ const el=$("#to"+gi); return el? el.value.trim() : groups[gi].dept.email; };
  // 宛先を編集したら、その課の既定アドレスにも反映（次回以降も使える）
  groups.forEach((g,gi)=>{ const el=$("#to"+gi); if(el) el.onchange=()=>{ const val=el.value.trim(); if(emailOK(val)){ g.dept.email=val; save(); } }; });
  $("#markAll").onclick=()=>{ targets.forEach(i=>i.requested=true); save(); toast("確認依頼を記録しました"); render(); };
  v.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ const gi=+b.dataset.copy; const txt=$("#body"+gi).innerText; navigator.clipboard?.writeText(txt).then(()=>toast("本文をコピーしました"),()=>toast("コピーできませんでした")); });
  v.querySelectorAll("[data-mailto]").forEach(b=>b.onclick=()=>{ const gi=+b.dataset.mailto, g=groups[gi], to=getTo(gi);
    if(!emailOK(to)){ toast("宛先メールアドレスを確認してください"); return; }
    location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(mailSubj(g))}&body=${encodeURIComponent(mailBody(g.dept.name,g.items))}`;
    g.items.forEach(i=>i.requested=true); save(); setTimeout(render,400); });
  async function sendGroup(g,to){
    await sendMailReal({to, subject:mailSubj(g), body:mailBody(g.dept.name,g.items)});
    g.items.forEach(i=>{ i.requested=true; i.requestedAt=Date.now(); });
  }
  v.querySelectorAll("[data-send]").forEach(b=>b.onclick=async ()=>{
    const gi=+b.dataset.send, g=groups[gi], to=getTo(gi);

    if(!confirm(`${to} へ確認依頼メールを送信します。よろしいですか？`)) return;

      try{ await sendGroup(j.g,j.to); ok++; }catch(e){ ng.push(`${j.g.dept.name}: ${e.message||e}`); }
    }
    save();
    toast(ng.length? `送信 ${ok}件／失敗 ${ng.length}件（${ng[0]}）` : `${ok}通すべて送信しました`);
    render();
  };
}
/* ---- 実送信（GAS: 自分のGmailから送信 ／ api: 社内メールAPI） ---- */
function tplCtx(dept,items){
  const lines=items.map((i,k)=>`  ${k+1}. ${i.media}／${i.client}（${i.period}）：${yen(i.inv)}`).join("\n");
  return { "部署":dept, "件数":String(items.length), "期間":(items[0]&&items[0].period)||"",
           "明細":lines, "会社名":S.company.name||"", "差出人":(S.mail&&S.mail.fromName)||"経理オートメーション" };
}
function renderTpl(tpl,ctx){ return String(tpl||"").replace(/\{(部署|件数|期間|明細|会社名|差出人)\}/g,(_,k)=>ctx[k]??""); }
function mailSubj(g){ return renderTpl((S.mailTpl&&S.mailTpl.subject)||DEFAULT_TPL_SUBJECT, tplCtx(g.dept.name,g.items)); }
function mailConfigured(){ const m=S.mail||{}; return (m.mode==="gas"&&m.gasUrl) || (m.mode==="api"&&m.apiUrl); }
async function sendMailReal({to,subject,body}){
  const m=S.mail||{};
  if(m.mode==="gas"){
    if(!m.gasUrl) throw new Error("GASのURLが未設定です（設定＞メール送信）");
    if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(m.gasUrl.trim()))
      throw new Error("GASのURL形式が正しくありません。デプロイ後に表示される「ウェブアプリのURL」（https://script.google.com/macros/s/…/exec で終わるもの）を貼ってください。エディタのURLや /dev は使えません");
    // Content-Type: text/plain でCORSプリフライトを回避（GASの定番パターン）
    let res;
    try{
      res=await fetch(m.gasUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({to,subject,body,fromName:m.fromName||"経理オートメーション",token:m.token||""})});
    }catch(err){
      let msg="GASに接続できませんでした（Failed to fetch）。最も多い原因：デプロイの「アクセスできるユーザー」が「全員」になっていない。GASエディタ→デプロイ→デプロイを管理→編集（鉛筆）→アクセス「全員」に変更→デプロイ。※設定変更後はURLが変わる場合があるので新しいURLを貼り直してください";
      if(inFrame()) msg+="／※現在プレビュー(iframe)内で動作中の可能性。公開ページ（GitHub Pages等）で開いてお試しください";
      throw new Error(msg);
    }
    if(!res.ok) throw await httpErr(res);
    let j=null; try{ j=await res.json(); }catch(e){ throw new Error("GASの応答を解釈できません（デプロイ設定「全員」を確認）"); }
    if(!j.ok) throw new Error(j.error||"送信に失敗しました（GAS側のエラー）");
    return true;
  }
  if(m.mode==="api"){
    if(!m.apiUrl) throw new Error("メールAPIのURLが未設定です（設定＞メール送信）");
    const res=await fetch(m.apiUrl,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({to,subject,body,token:m.token||""})});
    if(!res.ok) throw await httpErr(res);
    return true;
  }
  throw new Error("実送信は未設定です（設定＞メール送信でGASまたはAPIを設定）");
}
function mailBody(dept,items){
  return renderTpl((S.mailTpl&&S.mailTpl.body)||DEFAULT_TPL_BODY, tplCtx(dept,items));
}

    v.querySelectorAll(".recAct").forEach(inp=>inp.onchange=()=>{ const i=S.invoices.find(x=>x.id===+inp.dataset.act); const val=inp.value.trim(); i.act=val===""?null:(+val||0); save(); });
    runBtn.onclick=()=>reconcileRun(set);
  }
}
function reconcileRun(set){
  // ensure act present
  const missing=set.filter(i=>i.act==null);
  if(missing.length){ toast(`実費が未入力の請求が${missing.length}件あります`); }
  const btn=$("#recRun"); btn.disabled=true; btn.innerHTML='<span class="num">照合中…</span>';
  const rows=[...$("#recbody").children];
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  rows.forEach((row,idx)=>{
    const i=set[idx];
    setTimeout(()=>{ const st=row.lastElementChild; st.innerHTML='<span class="badge scan"><span class="bd"></span>照合中</span>'; }, reduce?0:idx*120);
    setTimeout(()=>{
      const st=row.lastElementChild; const dcell=row.querySelector("[data-d]");
      if(i.act==null){ i.reconciled="none"; st.innerHTML='<span class="badge pending"><span class="bd"></span>実費待ち</span>'; return; }
      const d=i.inv-i.act; i.diff=d;
      dcell.style.visibility="visible"; dcell.style.color=d?"var(--delta)":"var(--ink-3)";
      dcell.textContent = d?(d>0?'+':'−')+yen(Math.abs(d)).slice(1):'±0';
      i.reconciled = Math.abs(d)>S.params.tolerance ? "diff":"ok";
      st.innerHTML=statusBadge(i);
    }, reduce?0:idx*120+340);
  });
  setTimeout(()=>{
    save();
    const okC=set.filter(i=>i.reconciled==="ok").length, dlC=set.filter(i=>i.reconciled==="diff").length;
    if($("#mOk")) $("#mOk").textContent=okC; if($("#mDl")) $("#mDl").textContent=dlC;
    btn.disabled=false; btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg> 再照合';
    toast(`照合完了：OK ${okC}件／差異 ${dlC}件`);
    renderTabs();
  }, reduce?0:rows.length*120+520);
}
function exportAccountingCSV(){
  const set=S.invoices.filter(i=>i.approval==="approved");
  if(!set.length){ toast("送付対象（承認済み）がありません"); return; }
  const head=["媒体","クライアント","期間","請求額","実費","差異","照合","担当課"];
  const rows=set.map(i=>[i.media,i.client,i.period,i.inv,i.act==null?"":i.act,i.diff==null?"":i.diff,
    i.reconciled==="ok"?"OK":i.reconciled==="diff"?"差異":"未照合",i.dept]);
  set.forEach(i=>i.sent=true); save();
  downloadFile(`経理送付_${today()}.csv`, "\ufeff"+toCSV(head,rows), "text/csv;charset=utf-8");
  toast(`${set.length}件を経理へ書き出しました`); renderTabs();
}

// 統合スクリプト：メール送信 ＋ 受信箱からPDF請求書の取得
function doPost(e) {
  try {
    var d = JSON.parse(e.postData.contents);
    if (TOKEN &amp;&amp; d.token !== TOKEN) throw new Error("invalid token");

    if (d.action === "fetch") {           // 受信箱を検索してPDF添付を返す

      var max = Math.min(d.max || 10, 20);
      var threads = GmailApp.search(q, 0, max);
      var out = [];
      threads.forEach(function(t) {
        t.getMessages().forEach(function(m) {
          var atts = m.getAttachments().filter(function(a) {
            return a.getContentType() === "application/pdf" || /\.pdf$/i.test(a.getName());

            id: m.getId(), from: m.getFrom(), subject: m.getSubject(),
            date: m.getDate().toISOString(),
            attachments: atts.slice(0, 3).map(function(a) {
              return { name: a.getName(), data: Utilities.base64Encode(a.getBytes()) };
            })
          });
        });
      });
      return json({ ok: true, messages: out.slice(0, max) });
    }

    // 既定：メール送信
    MailApp.sendEmail({ to: d.to, subject: d.subject, body: d.body,
      name: d.fromName || "経理オートメーション" });
    return json({ ok: true });
  } catch (err) {
    return json({ ok: false, error: String(err) });
  }
}

/* ============================================================
   PDF 取込（ブラウザ内でpdf.jsによりテキスト抽出→項目を推定→確認して登録）
   ・ライブラリはcdnjsから遅延読込。読み込めない環境ではテキスト貼り付けに切替。
   ============================================================ */
const PDFJS_VER="3.11.174";
const PDFJS_SRC=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.min.js`;
const PDFJS_WORKER=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.worker.min.js`;
let _pdfLib=null;
function loadPdfJs(){
  return new Promise((resolve,reject)=>{
    if(_pdfLib) return resolve(_pdfLib);
    if(window.pdfjsLib){ _pdfLib=window.pdfjsLib; try{_pdfLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;}catch(e){} return resolve(_pdfLib); }
    const s=document.createElement("script"); s.src=PDFJS_SRC;
    const to=setTimeout(()=>reject(new Error("timeout")),15000);
    s.onload=()=>{ clearTimeout(to); if(window.pdfjsLib){ _pdfLib=window.pdfjsLib; try{_pdfLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;}catch(e){} resolve(_pdfLib); } else reject(new Error("no global")); };
    s.onerror=()=>{ clearTimeout(to); reject(new Error("load failed")); };
    document.head.appendChild(s);
  });
}
async function pdfToText(file){
  const lib=await loadPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf}).promise;
  let text="";
  for(let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p); const c=await page.getTextContent(); text+=c.items.map(i=>i.str).join(" ")+"\n"; }
  return text;
}
/* ---- field extraction (heuristic, reviewed by user) ---- */
function normNum(t){ return String(t).replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/，/g,",").replace(/[￥]/g,"¥"); }
function detectMedia(t){
  const s=t.toLowerCase();
  if(/tiktok|tik tok|ティックトック|bytedance|バイトダンス/.test(s)) return "TikTok広告";
  if(/google|グーグル|google ads|ads\.google/.test(s)) return "Google広告";
  if(/meta|facebook|instagram|メタ|フェイスブック|インスタグラム/.test(s)) return "Meta広告";
  if(/yahoo|ヤフー/.test(s)) return "Yahoo!広告";
  if(/microsoft|bing|マイクロソフト/.test(s)) return "Microsoft広告";
  if(/line\s*(ads|広告|株式会社)|lineヤフー|ライン広告/.test(s)) return "LINE広告";
  if(/(^|\W)x\s*(ads|corp|広告)|twitter|旧twitter|x\.com/.test(s)) return "X広告";
  return "";
}
function pickAmount(t){
  t=normNum(t);
  const labels=/(ご請求金額|請求金額|お支払い金額|お支払金額|請求額|合計金額|税込合計|総合計|総額|ご請求額|合計)\s*[:：]?\s*¥?\s*([0-9][0-9,]{2,})/g;
  let m,best=0; while((m=labels.exec(t))){ const v=+m[2].replace(/,/g,""); if(v>best) best=v; }
  if(best) return best;
  const re=/¥?\s*([0-9]{1,3}(?:,[0-9]{3})+|[0-9]{4,})\s*円?/g; let x,mx=0;
  while((x=re.exec(t))){ const v=+x[1].replace(/,/g,""); if(v>mx) mx=v; }
  return mx||null;
}
function pickPeriod(t){
  t=normNum(t);
  let m=t.match(/(20[0-9]{2})\s*[年\/\.\-]\s*([0-9]{1,2})\s*月?/);
  return m? m[1]+"-"+String(m[2]).padStart(2,"0") : "";
}
function pickClient(t){
  let m=t.match(/([一-龥ぁ-んァ-ヶA-Za-z0-9()（）・ー]{2,30}?)\s*御中/);
  if(m) return m[1].trim();
  m=t.match(/((?:株式会社|合同会社|有限会社)[一-龥ぁ-んァ-ヶA-Za-z0-9]{1,20})/);
  return m? m[1] : "";
}
function extractInvoice(text){
  const media=detectMedia(text), inv=pickAmount(text), period=pickPeriod(text)||"2026-06", client=pickClient(text);
  const conf=(media?1:0)+(inv?1:0)+(pickPeriod(text)?1:0);
  return { media, client, inv:inv||"", period, conf };
}

/* ---- AI extraction: send invoice info to an AI API and get structured fields ---- */
function aiConfigured(){ if(!S.ai) return false; const m=S.ai.mode; if(m==="auto"||m==="anthropic") return true; if(m==="gemini") return !!(S.ai.key&&S.ai.key.trim()); return !!(S.ai.endpoint&&S.ai.endpoint.trim()); }
function aiModeLabel(){ const m=S.ai&&S.ai.mode; return m==="custom"?"社内API":m==="anthropic"?"Anthropic":m==="gemini"?"Gemini":"Claude.ai 自動"; }
function aiEnabledForModal(){ const t=$("#aiToggle"); const on=t?t.checked:(S.ai&&S.ai.enabled); return !!(on&&aiConfigured()); }
function aiRunReason(){ if(!S.ai||!S.ai.enabled) return "AI抽出が無効になっています。"; if(S.ai.mode==="gemini"&&!(S.ai.key&&S.ai.key.trim())) return "Gemini APIキーが未設定です。"; if(!aiConfigured()) return "AI抽出のエンドポイントが未設定です。"; return null; }
function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]||""); r.onerror=()=>rej(new Error("read failed")); r.readAsDataURL(file); }); }
function buildPrompt(text){
  const names=(S.media||[]).map(m=>m.name).join("|")||"Google広告|Meta広告|Yahoo!広告";
  return `あなたは経理アシスタントです。次は広告媒体からの請求書です。以下の項目を**JSONのみ**で返してください（説明文・コードフェンス・前置き禁止）。
{"media":"${names}|その他 のいずれか","client":"広告主/アカウント名。無ければ空文字","amount":税込請求総額の整数(円)。無ければnull,"period":"対象期間 YYYY-MM。無ければ空文字","confidence":0〜1の数値}
${text?`請求書テキスト:\n"""${String(text).slice(0,8000)}"""`:"添付PDFの請求書を読み取ってください。"}`;
}
async function aiExtract({text,file}){
  if(!S.ai||!S.ai.enabled) throw new Error("AI無効");
  const cfg=S.ai;
  const promptFor=attached=>buildPrompt(attached?"":(text||""));

  // 社内API（プロキシ）：テキストを渡してJSONを受け取る契約
  if(cfg.mode==="custom"){
    if(!cfg.endpoint) throw new Error("エンドポイント未設定");
    const res=await fetch(cfg.endpoint,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:(text||"").slice(0,12000),filename:file?file.name:null})});
    if(!res.ok) throw await httpErr(res);
    return normalizeExtract(pickJson(await res.json()));
  }

  // Gemini API（generateContent・x-goog-api-key・JSONモード）
  if(cfg.mode==="gemini"){
    if(!cfg.key) throw new Error("Gemini APIキーが必要です（設定＞AI抽出）");
    let model=cfg.model||"gemini-3.5-flash"; if(/^claude/i.test(model)||/^gemini-(1\.|2\.0-)/.test(model)) model="gemini-3.5-flash";
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
    const parts=[]; let attached=false;
    if(file && !(text&&text.trim().length>40)){ try{ const b64=await fileToBase64(file); parts.push({inline_data:{mime_type:"application/pdf",data:b64}}); attached=true; }catch(e){} }
    parts.push({text:promptFor(attached)});
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":cfg.key},
      body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:"application/json",temperature:0,maxOutputTokens:2048}})});
    if(!res.ok){ const e=await httpErr(res); if(/api.?key.?not.?valid|API_KEY_INVALID|api key expired/i.test(e.message)){ e.message+="／確認：AIza…で始まるAI Studioのキーか・引用符や空白の混入・Generative Language APIが有効・Vertex用の資格情報は不可・キーにHTTPリファラー制限が無いか"; if(inFrame()) e.message+="／※このページはプレビュー(iframe)内で動作中。第三者APIが制限される場合があります。ファイルをダウンロードしてブラウザで直接開いてお試しください"; } else if(/no longer available|not found|404/i.test(e.message)){ e.message+="／このモデルは廃止されています。設定＞AI抽出のモデル名を「gemini-3.5-flash」に変更して保存してください"; } throw e; }
    return normalizeExtract(pickJson(await res.json()));
  }

  // Anthropic（auto: Claude.ai内でキー不要 / anthropic: キー使用）
  let model=cfg.model||"claude-sonnet-4-6"; if(/^gemini/i.test(model)) model="claude-sonnet-4-6";
  const url=(cfg.mode==="anthropic"&&cfg.endpoint)?cfg.endpoint:"https://api.anthropic.com/v1/messages";
  const content=[]; let attached=false;
  if(file && !(text&&text.trim().length>40)){ try{ const b64=await fileToBase64(file); content.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}}); attached=true; }catch(e){} }
  content.push({type:"text",text:promptFor(attached)});
  const headers={"Content-Type":"application/json"};
  if(cfg.key){ headers["x-api-key"]=cfg.key; headers["anthropic-version"]="2023-06-01"; headers["anthropic-dangerous-direct-browser-access"]="true"; }
  const res=await fetch(url,{method:"POST",headers,body:JSON.stringify({model,max_tokens:1000,messages:[{role:"user",content}]})});
  if(!res.ok) throw await httpErr(res);
  return normalizeExtract(pickJson(await res.json()));
}
async function httpErr(res){
  let detail="";
  try{ const t=await res.text(); try{ const j=JSON.parse(t); detail=(j.error&&(j.error.message||j.error.status))||j.message||(j.error?JSON.stringify(j.error):t); }catch(_){ detail=t; } }catch(e){}
  detail=(detail||"").toString().replace(/\s+/g," ").slice(0,300);
  return new Error("HTTP "+res.status+(detail?"："+detail:""));
}
function pickJson(data){
  if(data&&Array.isArray(data.content)){ const txt=data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n"); return looseJson(txt); }
  if(data&&data.candidates&&data.candidates[0]){ const cand=data.candidates[0]; const parts=(cand.content&&cand.content.parts)||[]; const txt=parts.map(p=>p.text||"").join("\n"); if(!txt.trim()) throw new Error("Geminiの応答が空です（finishReason: "+(cand.finishReason||"?")+"）"); return looseJson(txt); }
  if(data&&data.promptFeedback&&data.promptFeedback.blockReason) throw new Error("Geminiにブロックされました（"+data.promptFeedback.blockReason+"）");
  if(data&&typeof data==="object"){ if(data.invoices&&data.invoices[0]) return data.invoices[0]; if("media"in data||"amount"in data||"client"in data) return data; }
  if(typeof data==="string") return looseJson(data);
  throw new Error("応答を解釈できません");
}
function looseJson(s){ s=String(s).replace(/```json/gi,"").replace(/```/g,"").trim(); const a=s.indexOf("{"),b=s.lastIndexOf("}"); if(a>=0&&b>a) s=s.slice(a,b+1); return JSON.parse(s); }
function normalizeExtract(o){
  o=o||{};
  const media=(o.media||"").toString().trim();
  const invRaw=o.amount!=null?o.amount:(o.inv!=null?o.inv:"");
  const inv=(invRaw===""||invRaw==null)?"":(+String(invRaw).replace(/[^\d.-]/g,"")||0);
  const periodRaw=((o.period||"")+"").trim();
  const client=((o.client||"")+"").trim();
  let conf; if(typeof o.confidence==="number") conf=Math.round(o.confidence*3); else conf=(media?1:0)+(inv?1:0)+(periodRaw?1:0);
  return { media, client, inv:inv||"", period:periodRaw||"2026-06", conf:Math.max(0,Math.min(3,conf)) };
}

async function handleFiles(files){
  const st=$("#pdfStatus"); st.style.display="flex"; st.className="pdfstatus";
  const arr=[...files].filter(f=>/pdf$/i.test(f.name)||f.type==="application/pdf");
  if(!arr.length){ st.textContent="PDFファイルが見つかりません"; return; }
  const useAI=aiEnabledForModal(); const canSendFile=useAI && S.ai.mode!=="custom";
  let aiCount=0, fbCount=0, lastErr=null;
  for(let k=0;k<arr.length;k++){
    const f=arr[k];
    st.className="pdfstatus";
    st.innerHTML=`<span class="spin"></span>${useAI?"AIが読み取り中":"読み取り中"}… ${k+1}/${arr.length}：${esc(f.name)}`;
    let ext=null, kind="pdf";
    // 1) マルチモーダル（Anthropic/auto/Gemini）：PDF本体を直接AIへ（スキャンPDFも可・pdf.js不要）
    if(canSendFile){ try{ ext=await aiExtract({file:f}); kind="ai"; }catch(e){ lastErr=e; } }
    if(!ext){
      try{
        const text=await pdfToText(f);
        if(useAI){ try{ ext=await aiExtract({text,file:f}); kind=S.ai.mode==="custom"?"api":"ai"; }catch(e){ lastErr=e; ext=extractInvoice(text); kind="pdf"; } }
        else { ext=extractInvoice(text); kind="pdf"; }
      }catch(err){
        if(String(err.message).match(/load failed|timeout|no global/)){
          st.className="pdfstatus err";
          st.innerHTML=`PDFを読み取れませんでした（ライブラリ未読込／接続不可）。設定＞AI抽出でエンドポイントを設定するか、下の「テキスト貼り付け」をご利用ください。`;
          return;
        }
        ext={media:"",client:"",inv:"",period:"2026-06",conf:0}; kind="error";
      }
    }
    if(kind==="ai"||kind==="api") aiCount++; else fbCount++;
    addDraft(f.name, ext, kind); renderReview();
  }
  if(useAI && aiCount===0){
    st.className="pdfstatus err";
    st.innerHTML=`AIで読み取れませんでした：${lastErr?esc(String(lastErr.message||lastErr)):"接続不可の可能性"}。推定で入力しています。設定＞AI抽出（接続テスト）をご確認ください。`;
  } else if(useAI){
    st.className="pdfstatus";
    st.innerHTML=`✓ AIが ${aiCount}件を自動入力${fbCount?`／${fbCount}件は推定（要確認）`:""}。内容を確認して「登録」。`;
  } else {
    st.className="pdfstatus";
    st.innerHTML=`✓ ${pdfDraft.length}件を推定で入力（AI未使用）。内容を確認・修正して「登録」。`;
  }
}
function addDraft(name,ext,kind){
  pdfDraft.push({ name, kind, media:ext.media||"", client:ext.client||"", inv:ext.inv||"", period:ext.period||"2026-06",
    dept:(S.depts[0]&&S.depts[0].name)||"", conf:ext.conf||0, include:true });
}
function mediaOpts(sel){ return `<option value="">未判定</option>`+(S.media||[]).map(m=>`<option ${sel===m.name?"selected":""}>${esc(m.name)}</option>`).join("")+`<option ${sel==="その他"?"selected":""}>その他</option>`; }
function deptOpts(sel){ return S.depts.map(d=>`<option ${sel===d.name?"selected":""}>${esc(d.name)}</option>`).join(""); }
function renderReview(){
  const c=$("#review"); if(!c) return;
  if(!pdfDraft.length){ c.innerHTML=""; $("#pdfSave").disabled=true; return; }
  c.innerHTML=`<div class="scrollx"><table class="dtable">
    <thead><tr><th>ファイル／推定</th><th>媒体</th><th>クライアント</th><th>期間</th><th class="n">請求額</th><th>担当課</th><th>登録</th></tr></thead>
    <tbody>${pdfDraft.map((d,i)=>{
      const cc=d.conf>=3?"hi":d.conf===2?"mid":"lo"; const cl=d.conf>=3?"推定 高":d.conf===2?"推定 中":"要確認";
      const kt=d.kind==="ai"?"AI読取":d.kind==="api"?"社内API":d.kind==="error"?"要手入力":d.kind==="paste"?"貼り付け":"推定";
      const kc=d.kind==="ai"||d.kind==="api"?"hi":d.kind==="error"?"lo":"mid";
      const needClient=!String(d.client).trim();
      const clStyle=needClient?"width:130px;border-color:var(--delta)":"width:130px";
      return `<tr>
        <td style="max-width:170px"><div style="font-size:11px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.name)}</div><span class="confpill ${kc}">${kt}</span> <span class="confpill ${cc}">${cl}</span></td>
        <td><select class="rvinput" data-i="${i}" data-f="media">${mediaOpts(d.media)}</select></td>
        <td><input class="rvinput" data-i="${i}" data-f="client" value="${esc(d.client)}" placeholder="${needClient?'広告主を入力':'—'}" style="${clStyle}">${needClient?'<div style="font-size:9.5px;color:var(--delta);margin-top:2px">要入力</div>':''}</td>
        <td><input class="rvinput" data-i="${i}" data-f="period" value="${esc(d.period)}" style="width:78px"></td>
        <td class="n"><input class="rvinput num" data-i="${i}" data-f="inv" type="number" value="${d.inv}" placeholder="0" style="width:108px"></td>
        <td><select class="rvinput" data-i="${i}" data-f="dept">${deptOpts(d.dept)}</select></td>
        <td style="text-align:center"><input type="checkbox" data-i="${i}" data-f="include" ${d.include?"checked":""}></td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
  c.querySelectorAll("[data-i][data-f]").forEach(el=>{
    const ev = el.type==="checkbox"||el.tagName==="SELECT" ? "change":"input";
    el.addEventListener(ev,()=>{ const i=+el.dataset.i, f=el.dataset.f;
      pdfDraft[i][f] = f==="include"? el.checked : (f==="inv"? (+el.value||0) : el.value);
      updatePdfSave();
    });
  });
  updatePdfSave();
}
function updatePdfSave(){ const ok=pdfDraft.some(d=>d.include && d.client.trim() && +d.inv>0); const b=$("#pdfSave"); if(b) b.disabled=!ok; }
/* ---- 受信箱（Gmail via GAS）からPDF請求書を取込 ---- */
async function inboxFetch(box){
  if(!box||!box.url) throw new Error("受信箱のGAS URLが未設定です（設定＞受信箱）");
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(box.url.trim()))
    throw new Error("受信箱のURL形式が正しくありません（…/exec で終わるウェブアプリURLを設定）");
  let res;
  try{
    res=await fetch(box.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"fetch", token:box.token||"", query:S.inboxQuery||"has:attachment filename:pdf newer_than:30d", max:10})});
  }catch(err){
    throw new Error("受信箱に接続できませんでした（Failed to fetch）。GASのデプロイが「実行：自分／アクセス：全員」か、統合スクリプト（fetch対応版）に更新済みかを確認してください");
  }
  if(!res.ok) throw await httpErr(res);
  let j=null; try{ j=await res.json(); }catch(e){ throw new Error("受信箱の応答を解釈できません（GASを統合スクリプトに更新してください）"); }
  if(!j.ok) throw new Error(j.error||"受信箱の取得に失敗しました");
  return j.messages||[];
}
let inboxMsgs=[];
function inboxImportModal(){
  const boxes=(S.inboxes||[]).map((b,k)=>({...b,idx:k}));
  const usable=boxes.filter(b=>b.url);
  const opts=boxes.map(b=>`<option value="${b.idx}" ${b.url?"":"disabled"}>${esc(b.name)}${b.url?"":"（URL未設定）"}</option>`).join("");
  openModal("受信箱からPDF請求書を取込",`
    <div class="pad" style="padding-bottom:6px">
      ${usable.length?"":`<div class="banner"><span class="warnpill">未設定</span><div>受信箱が未設定です。<b>設定 ＞ 受信箱（メール取込）</b>でGASのURLを登録してください。</div></div>`}
      <div class="form" style="padding:0 0 12px">
        <div class="field"><label>読み取る受信箱（アカウント）</label><select id="ibSel">${opts}</select></div>
        <div class="field"><label>検索条件（Gmail検索構文）</label><input id="ibQuery" value="${esc(S.inboxQuery)}"></div>
      </div>
      <button class="btn pri" id="ibFetch" ${usable.length?"":"disabled"}>受信箱を確認</button>
      <div class="pdfstatus" id="ibStatus" style="display:none"></div>
      <div id="ibList" style="margin-top:10px"></div>
    </div>`, null, null);
  $("#ibFetch").onclick=async ()=>{
    const box=S.inboxes[+$("#ibSel").value];
    S.inboxQuery=$("#ibQuery").value.trim()||S.inboxQuery; save();
    const st=$("#ibStatus"); st.style.display="flex"; st.className="pdfstatus";
    st.innerHTML='<span class="spin"></span>受信箱を確認中…';
    try{
      inboxMsgs=await inboxFetch(box);
      st.innerHTML=inboxMsgs.length? `✓ PDF添付のメールが ${inboxMsgs.length}件 見つかりました。取り込むものを選んでください。` : "PDF添付のメールは見つかりませんでした（検索条件を変えてお試しください）";
      renderInboxList();
    }catch(e){ st.className="pdfstatus err"; st.innerHTML=esc(String(e.message||e)); }
  };
}
function renderInboxList(){
  const c=$("#ibList"); if(!c) return;
  if(!inboxMsgs.length){ c.innerHTML=""; return; }
  const done=new Set(S.importedMsgIds||[]);
  c.innerHTML=`<div class="scrollx"><table class="dtable">
    <thead><tr><th style="width:34px"></th><th>件名／差出人</th><th>添付PDF</th><th>受信日</th></tr></thead>
    <tbody>${inboxMsgs.map((m,k)=>{
      const dup=done.has(m.id);
      return `<tr style="${dup?'opacity:.55':''}">
        <td><input type="checkbox" data-ib="${k}" ${dup?"":"checked"}></td>
        <td><span class="cl">${esc(m.subject||"（件名なし）")}<span class="p">${esc(m.from||"")}</span></span>${dup?' <span class="confpill mid">取込済</span>':''}</td>
        <td style="font-size:11px;color:var(--ink-2)">${(m.attachments||[]).map(a=>esc(a.name)).join("<br>")}</td>
        <td style="font-family:var(--mono);font-size:11px;color:var(--ink-3)">${esc((m.date||"").slice(0,10))}</td>
      </tr>`;}).join("")}</tbody></table></div>
    <button class="btn pri" id="ibImport" style="margin-top:12px">選択したPDFをAIで読み取る</button>`;
  $("#ibImport").onclick=()=>{
    const picks=[...c.querySelectorAll("[data-ib]:checked")].map(el=>inboxMsgs[+el.dataset.ib]);
    if(!picks.length){ toast("取り込むメールを選択してください"); return; }
    const files=[];
    picks.forEach(m=>{ (m.attachments||[]).forEach(a=>{ try{ files.push(b64toFile(a.data,a.name||"invoice.pdf")); }catch(e){} });
      if(!(S.importedMsgIds||[]).includes(m.id)) S.importedMsgIds.push(m.id); });
    if(S.importedMsgIds.length>500) S.importedMsgIds=S.importedMsgIds.slice(-500);
    save();
    if(!files.length){ toast("添付PDFを読み込めませんでした"); return; }
    closeModal();
    pdfImportModal();
    setTimeout(()=>handleFiles(files),80);
  };
}
function savePdfDraft(){
  const rows=pdfDraft.filter(d=>d.include && d.client.trim() && +d.inv>0);
  if(!rows.length){ toast("クライアント名と請求額が必要です"); return; }
  rows.forEach(d=>S.invoices.push({ id:S.seq++, media:d.media||"その他", client:d.client.trim(), period:d.period||"2026-06",
    inv:+d.inv||0, act:null, dept:d.dept||(S.depts[0]&&S.depts[0].name)||"", owner:"", flag:null, pdf:d.name,
    requested:false, approval:"pending", note:"", decidedAt:null, sent:false, reconciled:"none", diff:null }));
  save(); toast(`${rows.length}件を登録しました`); closeModal(); render();
}

/* ============================================================
   MODAL / boot
   ============================================================ */
function openModal(title,inner,okLabel,onOk){
  const o=$("#overlay");
  o.innerHTML=`<div class="mbox"><div class="mh"><h3>${esc(title)}</h3><button class="btn icon" id="mX">✕</button></div>
    <div>${inner}</div>
    <div class="mf"><button class="btn" id="mCancel">キャンセル</button>${okLabel?`<button class="btn pri" id="mOk">${esc(okLabel)}</button>`:""}</div></div>`;
  o.classList.add("show");
  const close=()=>closeModal();
  $("#mX").onclick=close; $("#mCancel").onclick=close;
  o.onclick=(e)=>{ if(e.target===o) close(); };
  if(okLabel){ $("#mOk").onclick=()=>{ const r=onOk(); if(r!==false) closeModal(); }; }
}
function closeModal(){ const o=$("#overlay"); o.classList.remove("show"); o.innerHTML=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* ---------- bootstrap state (helpers are now defined) ---------- */
function migrate(){
  if(!S) return;
  if(!S.ai) S.ai={ enabled:true, mode:"auto", endpoint:"", model:"claude-sonnet-4-6", key:"" };
  if(S.ai.model===undefined) S.ai.model="claude-sonnet-4-6";
  if(S.ai.mode==="gemini" && /^gemini-(1\.|2\.0-|2\.5-)/.test(S.ai.model||"")) S.ai.model="gemini-3.5-flash";
  if(!S.mail) S.mail={ mode:"mailto", gasUrl:"", apiUrl:"", token:"", fromName:"経理オートメーション" };
  if(!S.media||!S.media.length) S.media=Object.keys(MEDIA).filter(k=>k!=="その他").map(k=>({name:k,bg:MEDIA[k].bg,ini:MEDIA[k].ini}));
  if(!S.inboxes||!S.inboxes.length) S.inboxes=[{name:"メイン受信箱", url:S.mail&&S.mail.gasUrl||"", token:S.mail&&S.mail.token||""}];
  if(!S.inboxQuery) S.inboxQuery="has:attachment filename:pdf newer_than:30d";
  if(!S.importedMsgIds) S.importedMsgIds=[];
  if(S.company&&S.company.icon===undefined) S.company.icon=null;
  if(!S.mailTpl) S.mailTpl={ subject:DEFAULT_TPL_SUBJECT, body:DEFAULT_TPL_BODY };
  (S.invoices||[]).forEach(i=>{ if(i.reconciled===undefined) i.reconciled="none"; if(i.approval===undefined) i.approval="pending"; if(i.pdf===undefined) i.pdf=null; });
}
S = loadRaw();
if(!S){ S = defaultState(); S.invoices = sampleInvoices(); S.seq = 11; }
migrate();
save();

render();
</script>
